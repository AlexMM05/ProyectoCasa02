<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokeAPI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="card">
        <h1>Consulta PokeAPI</h1>

        <form id="formulario">
            <div class="form-group">
                <label for="numero">Número de Pokédex:</label>
                <input type="number" id="numero" name="numero" placeholder="Ej. 25" min="1">
            </div>
            
            <button type="button" id="btnConsultarID">Consultar</button>

            <div class="form-group" style="margin-top: 20px;">
                <label for="nombre">Nombre del Pokemon:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Resultado..." readonly>
            </div>
        </form>
    </main>
    
    <script src="./scripts.js"></script>
</body>
</html>
